<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مناقصة كأس العالم 2034 · الجولة الثالثة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap">
<style>

/* مسرح ثابت 1920×1080 يتمدد ليملأ أي شاشة. ملعب ليلي، وذهب الكأس للتمييز، ولكل فريق لونه */
:root{
  --bg:#08131f; --panel:#0f2133; --panel2:#152d45; --line:#24486a;
  --fg:#eef3f8; --muted:#93abc2; --gold:#f0b84a; --ok:#3ccf86; --bad:#ef6450;
  --t1:#4aa8ff; --t2:#3fd08a; --t3:#ff9a3c;
  --display:"Reem Kufi","Tahoma",sans-serif;
  --body:"IBM Plex Sans Arabic","Tahoma","Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--body);-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;
  background:radial-gradient(1200px 600px at 30% 0%,#173756 0,transparent 70%),radial-gradient(900px 500px at 100% 100%,#122a1f 0,transparent 70%),var(--bg);
  font-size:26px;line-height:1.55;overflow:hidden}

/* الرأس */
.head{position:absolute;inset:0 0 auto 0;height:96px;display:flex;align-items:center;gap:28px;padding:0 36px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:38px;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-family:var(--body);font-size:18px;color:var(--muted)}
.brand b{color:var(--gold)}
.steps{flex:1;display:flex;gap:6px;align-items:center;justify-content:center;min-width:0}
.steps span{height:8px;flex:1;max-width:90px;border-radius:4px;background:var(--line)}
.steps span.done{background:var(--muted)}
.steps span.on{background:var(--gold)}
.scores{display:flex;gap:12px}
.chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--c);border-radius:999px;padding:6px 18px;font-weight:700;font-size:22px;transition:transform .25s}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c)}
.chip .pts{font-family:var(--display);font-size:28px;color:var(--c);min-width:2.4ch;text-align:center;font-variant-numeric:tabular-nums}
.chip.bump{transform:scale(1.12)}

/* لوحة القصة */
.story{position:absolute;top:116px;right:36px;width:740px;height:640px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px 34px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.kick{display:flex;gap:10px;flex-wrap:wrap;font-size:18px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:999px;padding:2px 14px}
.tag.obj{border-color:var(--gold);color:var(--gold)}
.tag.branch{border-color:var(--bad);color:var(--bad)}
.story h2{margin:0;font-family:var(--display);font-size:48px;line-height:1.2;text-wrap:balance}
.story p{margin:0}
.narr{font-size:25px}
.q{font-weight:700;color:var(--gold);font-size:27px}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.opts li{display:flex;gap:14px;align-items:flex-start;background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:8px 14px;font-size:23px;line-height:1.4}
.opts li b{font-family:var(--display);color:var(--gold);min-width:1.2em;font-size:26px}
.opts li.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel2))}
.why{margin-top:auto;border-inline-start:5px solid var(--ok);background:var(--panel2);border-radius:10px;padding:12px 16px;font-size:21px;line-height:1.5}
.why b{color:var(--ok)}
.why .src{color:var(--muted);font-size:18px}
.scroll{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}

/* العرض ثلاثي الأبعاد */
.view{position:absolute;top:116px;left:36px;width:1084px;height:640px;border-radius:22px;border:1px solid var(--line);overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#14304a 0,#09172a 75%)}
.view canvas{display:block;touch-action:none}
.lbl{position:absolute;transform:translate(-100%,-50%);margin-left:-14px;font-family:var(--display);font-size:22px;padding:4px 14px;border-radius:10px;background:rgba(6,16,28,.86);border:2px solid var(--line);white-space:nowrap;pointer-events:none;transition:opacity .3s}
.lbl.drop{pointer-events:auto;border-style:dashed;border-color:var(--gold);color:var(--muted);min-width:170px;text-align:center}
.lbl.drop.hot{background:rgba(240,184,74,.25)}
.lbl.ok{border-color:var(--ok);color:var(--fg)}
.viewtools{position:absolute;bottom:16px;left:16px;display:flex;gap:10px}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:40px}
.zone{position:absolute;width:300px;border:3px dashed var(--c);border-radius:18px;background:color-mix(in srgb,var(--c) 10%,transparent);padding:14px;display:flex;flex-direction:column;gap:8px;align-items:center}
.zone h5{margin:0;font-family:var(--display);font-size:26px;color:var(--c)}
.zone .got{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:17px}
.zone .got span{background:var(--panel2);border-radius:8px;padding:2px 10px}
.zone.hot{background:color-mix(in srgb,var(--c) 28%,transparent)}
.toast{position:absolute;top:24px;left:50%;transform:translateX(-50%);background:rgba(6,16,28,.92);border:2px solid var(--gold);border-radius:14px;padding:10px 22px;font-size:22px;max-width:90%;text-align:center;pointer-events:none;transition:opacity .3s}
.apptap{position:absolute;display:flex;gap:14px;bottom:80px;left:50%;transform:translateX(-50%)}
.apptap button{width:86px;height:86px;border-radius:22px;font-size:16px;font-weight:700;line-height:1.2;box-shadow:0 6px 0 rgba(0,0,0,.35)}

/* الفرق */
.bottom{position:absolute;top:776px;right:36px;left:36px;height:220px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;height:100%}
.team{background:var(--panel);border:3px solid var(--c);border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.team h4{margin:0;display:flex;justify-content:space-between;align-items:center;font-family:var(--display);color:var(--c);font-size:30px}
.st{font-family:var(--body);font-size:19px;font-weight:700;color:var(--muted)}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
.picks{display:flex;gap:10px}
.picks button{flex:1;height:76px;border-radius:14px;background:var(--panel2);border:3px solid var(--line);font-family:var(--display);font-size:40px;transition:transform .1s}
.picks button:active{transform:scale(.96)}
.picks.locked button{cursor:default}
.picks button.sel{background:var(--c);color:#06121d;border-color:var(--c)}
.picks button.right{border-color:var(--ok)}
.cons{font-size:20px;line-height:1.45;color:var(--fg);overflow:auto}
.team.lockedin{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent)}

/* الأنشطة */
.act{display:flex;gap:20px;height:100%}
.turn{width:330px;flex:none;background:var(--panel);border:3px solid var(--c);border-radius:18px;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:6px;text-align:center}
.turn small{color:var(--muted);font-size:20px}
.turn b{font-family:var(--display);font-size:40px;color:var(--c)}
.tray{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-content:center;justify-content:center}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:10px 18px;font-size:22px;font-weight:700;cursor:grab;touch-action:none;max-width:420px;text-align:center;line-height:1.35}
.card.dragging{opacity:.3}
.ghost{position:fixed;z-index:99;pointer-events:none;background:var(--panel2);border:3px solid var(--gold);border-radius:14px;padding:10px 18px;font-family:var(--body);font-size:22px;font-weight:700;color:var(--fg);transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 10px 30px rgba(0,0,0,.5);direction:rtl}

/* جدول الفروق */
.tbl{width:100%;border-collapse:separate;border-spacing:6px;font-size:18px;table-layout:fixed}
.tray.small .card{font-size:16px;padding:6px 12px;max-width:330px;border-radius:10px}
.tray{overflow:auto}
.tbl th{font-family:var(--display);font-size:22px;color:var(--gold);font-weight:500}
.tbl td.k{font-weight:700;color:var(--muted);width:120px;font-size:17px;line-height:1.3}
.cell{height:66px;font-size:16px;border:2px dashed var(--line);border-radius:12px;padding:6px 10px;vertical-align:middle;text-align:center;line-height:1.3}
.cell.hot{border-color:var(--gold);background:rgba(240,184,74,.15)}
.cell.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}

/* التحكم */
.ctrl{position:absolute;bottom:14px;right:36px;left:36px;height:0}
.ctrlbar{position:absolute;top:116px;left:36px}
.btn{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 22px;font-weight:700;font-size:22px}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.btn:disabled{opacity:.35;cursor:default}
.nav{position:absolute;bottom:12px;left:36px;display:flex;gap:12px;align-items:center}
.nav .timer{font-family:var(--display);font-size:30px;min-width:3.4ch;text-align:center;font-variant-numeric:tabular-nums}
.nav .timer.low{color:var(--bad)}

/* الشاشة الافتتاحية والختامية */
.big{font-family:var(--display);font-size:64px;line-height:1.15;margin:0;text-wrap:balance}
.big b{color:var(--gold)}
.sum{width:100%;border-collapse:collapse;font-size:24px}
.sum th,.sum td{padding:10px;border-bottom:1px solid var(--line);text-align:center;font-variant-numeric:tabular-nums}
.sum th:first-child,.sum td:first-child{text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== إضافات الحصة الثالثة ===== */
.pipe{display:grid;gap:7px;margin-top:6px}
.slot{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:5px 10px;min-height:56px}
.slot .n{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-size:22px;background:var(--panel2);color:var(--muted)}
.slot.hot{border-color:var(--gold);background:rgba(240,184,74,.12)}
.slot.ok{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.slot.ok .n{background:var(--ok);color:#06121d}
.slot .d{font-size:15px;line-height:1.4;color:var(--fg)}
.slot .got{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.slot .got span{background:var(--panel2);border:1px solid var(--ok);border-radius:8px;padding:0 8px;font-size:13.5px;color:#cfeedd}
/* لبنات */
.blk{display:grid;gap:0;margin-top:8px;max-width:600px}
.bslot{position:relative;min-height:62px;border:2px dashed var(--line);border-radius:10px;margin-bottom:10px;display:flex;align-items:center;padding:6px 16px;font-size:20px;color:var(--muted)}
.bslot.hot{border-color:var(--gold);background:rgba(240,184,74,.12)}
.bslot.ok{border:0;color:#06121d;font-weight:800;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.bslot.ok::after{content:"";position:absolute;bottom:-10px;right:34px;width:34px;height:12px;border-radius:0 0 8px 8px;background:inherit}
.bslot.k0.ok{background:#f0b84a}.bslot.k1.ok{background:#4aa8ff;margin-right:40px}.bslot.k2.ok{background:#3fd08a;margin-right:80px}
.bslot .i{font-family:var(--display);margin-left:12px}
.codep{position:absolute;top:70px;left:24px;width:400px;background:#050b12;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.codep h6{margin:0;padding:8px 14px;background:#0d1a28;font-family:var(--display);font-size:20px;font-weight:500;color:var(--muted)}
.codep pre{margin:0;padding:14px;min-height:130px;direction:ltr;text-align:left;font:16px/1.7 Consolas,"Courier New",monospace;color:#cfe3ff;white-space:pre-wrap}
.codep pre .cur{display:inline-block;width:9px;height:18px;background:#f0b84a;vertical-align:middle;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.codep .err{background:#3a0d10;color:#ffb3a6;padding:8px 14px;font-size:17px;font-weight:700}
.codep .okk{background:#0b2f1d;color:#8ff0bf;padding:8px 14px;font-size:17px;font-weight:700}
.tray.small .card{font-size:17px;padding:8px 14px}
</style>
</head>
<body>
<div id="stage">
  <header class="head">
    <div class="brand">مناقصة كأس العالم <b>2034</b><small>الجولة الثالثة: أداة البناء · التقنية الرقمية · ص 117</small></div>
    <div class="steps" id="steps"></div>

  const cx=300,cy=420; for(let i=0;i<14;i++){ const a=i/14*Math.PI*2+Math.random()*0.3; let x=cx,y=cy; g.beginPath(); g.moveTo(x,y); for(let j=0;j<5;j++){ x+=Math.cos(a+(Math.random()-.5)*.6)*90; y+=Math.sin(a+(Math.random()-.5)*.6)*90; g.lineTo(x,y);} g.stroke(); }
  txt(g,"الجوال تحطم",w/2,820,44,"#ef6450"); return R.scr.tex.needsUpdate=true; }
 if(mode==="restored"){ bg("#f4f7fb","#e8eef5"); txt(g,"جوال جديد",w/2,100,34,"#5b6b7c","normal"); txt(g,"مرحباً من جديد",w/2,170,48,"#0d1b2a");
  g.fillStyle="#dde9f7"; [[256,300,70],[196,320,52],[316,320,52]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill();}); g.fillStyle="#4aa8ff"; g.beginPath(); g.moveTo(256,300); g.lineTo(226,340); g.lineTo(286,340); g.fill();
  g.fillStyle="#0f3a5c"; rr(g,40,420,432,240,30); g.fill(); txt(g,"تذكرتك محفوظة",w/2,500,38,"#8ff0bf"); txt(g,"مباراة الافتتاح",w/2,565,34,"#fff"); txt(g,"البوابة 7 · المقعد C-14",w/2,620,30,"#bcd3e8","normal");
  g.fillStyle="#f0b84a"; rr(g,40,710,432,110,28); g.fill(); txt(g,"بوابتي",w/2,785,44,"#1a1405"); return R.scr.tex.needsUpdate=true; }
}

function syncTools(){ const d=dragState("tools"); const on=new Set(Object.keys(d.placed).map(i=>NODES.tools.items[i].t)); TOOLS.forEach((t,i)=>toolOn[i]=on.has(t)); }
function syncFeats(){ const d=dragState("features"); for(let k=0;k<5;k++) featOn[k]=false; Object.keys(d.placed).forEach(i=>featOn[NODES.features.items[i].k]=true); }
function setScene(kind){
 if(!R.scene) return;
 showTools=false; showIcons=false; syncTools(); syncFeats();
 if(kind==="home") paintScreen("home");
 if(kind==="tools"){ showTools=true; paintScreen("home"); }
 if(kind==="build") paintScreen("build");
 if(kind==="blocks") paintScreen(blocksDone()?"gate":"build",true);
 if(kind==="features"){ showIcons=true; showTools=false; paintScreen("build"); }
 if(kind==="cracked"){ showIcons=true; paintScreen("cracked",true); }
}
function reaction(kind){
 if(!R.scene) return;
 if(kind==="restore"){ paintScreen("restored"); featOn[4]=true; pulse=4; pulseT=2.2; }
 if(kind==="gate") paintScreen("gate");
}

/* ====================================================================
   الواجهة والمحرك
   ==================================================================== */
const $=id=>document.getElementById(id);
const storyEl=$("story"), bottomEl=$("bottom"), overlay=$("overlay");
let toastT=0; function toast(m){const t=$("toast");t.textContent=m;t.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>t.style.opacity=0,2800);}
function renderScores(bump){ $("scores").innerHTML=TEAMS.map((t,k)=>`<span class="chip ${bump&&bump.includes(k)?"bump":""}" style="--c:${t.c}"><i></i>${t.name}<span class="pts">${S.scores[k]}</span></span>`).join(""); if(bump) setTimeout(()=>document.querySelectorAll(".chip.bump").forEach(c=>c.classList.remove("bump")),350); }
function renderSteps(){ const ch=CHAPTERS.indexOf(PARENT[S.node]||S.node); $("steps").innerHTML=CHAPTERS.map((_,i)=>`<span class="${i<ch?"done":i===ch?"on":""}"></span>`).join(""); }
function kickHTML(n){ return `<div class="kick">${n.obj!==undefined?`<span class="tag obj">الهدف ${n.obj}</span>`:""}${n.page?`<span class="tag">الكتاب ص ${n.page}</span>`:""}${n.branch?`<span class="tag branch">مسار الإنقاذ</span>`:""}</div>`; }
const whyHTML=(n,label)=>`<div class="why"><b>${label||"من الكتاب:"}</b> ${n.why||n.done} <span class="src">(ص ${n.page})</span></div>`;

function render(){
 stopTimer(); overlay.innerHTML=""; $("viewtools").hidden=false;
 const n=NODES[S.node]; renderSteps(); renderScores(); setScene(n.scene);
 $("prevBtn").disabled=S.hist.length===0;
 $("timerBtn").hidden=n.type!=="dec"; $("timerView").textContent="";
 $("revealBtn").hidden=n.type!=="dec";
 $("nextBtn").textContent=n.type==="end"?"بداية جديدة":"التالي ←";
 ({intro:renderIntro,dec:renderDec,drag:renderDrag,end:renderEnd})[n.type](n);
 updateNext(); save();
}
function updateNext(){ const n=NODES[S.node]; let ok=true;
 if(n.type==="dec") ok=decState(S.node).rev; if(n.type==="drag") ok=dragDone(n);
 $("nextBtn").disabled=!ok; $("nextBtn").classList.toggle("gold",ok); }

function renderIntro(n){
 storyEl.innerHTML=`<div class="kick"><span class="tag">الجولة الثالثة</span><span class="tag">الوحدة الثالثة · الدرس الأول</span></div>
  <h2 class="big">${n.title}</h2><p class="narr">${n.text}</p>
  <p class="narr" style="color:var(--muted)">في هذه الجولة: أمثلة لبرامج إنشاء تطبيقات الهواتف الذكية، ومطوّر التطبيقات MIT وطريقة البناء فيه، ومميزات استخدامه.</p>`;
 bottomEl.innerHTML=`<div class="teams">${TEAMS.map((t,k)=>`<div class="team" style="--c:${t.c}"><h4>${t.name}<span class="st">${S.scores[k]} نقطة</span></h4><div class="cons">النقاط تبدأ من جديد في هذه الجولة، وتُجمع مع الجولات الأخرى في النهاية.</div></div>`).join("")}</div>`;
}

function renderDec(n){
 const st=decState(S.node);
 storyEl.innerHTML=`${kickHTML(n)}<h2>${n.title}</h2><div class="scroll">${st.rev?"":`<p class="narr">${n.text}</p>`}<p class="q">${n.q}</p>
  <ol class="opts">${n.opts.map((o,k)=>`<li class="${st.rev&&k===n.ans?"right":""}"><b>${LET[k]}</b><span>${o}</span></li>`).join("")}</ol></div>${st.rev?whyHTML(n):""}`;
 bottomEl.innerHTML=`<div class="teams">${TEAMS.map((t,k)=>{ const c=st.c[k];
  const status=st.rev?(c===null?'<span class="st">لم يقرر</span>':c===n.ans?`<span class="st ok">✓ صحيح +${P_DEC}</span>`:'<span class="st bad">✗ قرار خاطئ</span>'):(c===null?'<span class="st">يتناقش…</span>':'<span class="st ok">🔒 تم القرار</span>');
  const picks=n.opts.map((_,o)=>`<button data-t="${k}" data-o="${o}" class="${st.rev?((c===o?"sel ":"")+(o===n.ans?"right":"")):""}" aria-label="${t.name} يختار ${LET[o]}">${LET[o]}</button>`).join("");
  return `<div class="team ${!st.rev&&c!==null?"lockedin":""}" style="--c:${t.c}"><h4>${t.name}${status}</h4><div class="picks ${st.rev?"locked":""}">${picks}</div>${st.rev&&c!==null?`<div class="cons">${n.cons[c]}</div>`:""}</div>`;}).join("")}</div>`;
 bottomEl.querySelectorAll(".picks button").forEach(b=>b.onclick=()=>{ if(st.rev) return; const k=+b.dataset.t,o=+b.dataset.o; st.c[k]=(st.c[k]===o?null:o); save(); renderDec(n); });
 $("revealBtn").disabled=st.rev;
 if(st.rev&&n.onReveal) reaction(n.onReveal);
}
function doReveal(){ const n=NODES[S.node]; if(n.type!=="dec") return; const st=decState(S.node); if(st.rev) return;
 st.rev=true; const bump=[]; st.c.forEach((c,k)=>{ if(c===null) return; S.log.tries[k]++; if(c===n.ans){S.scores[k]+=P_DEC;S.log.right[k]++;bump.push(k);} });
 save(); renderDec(n); renderScores(bump); updateNext();
 const nx=n.next({right:st.c.filter(c=>c===n.ans).length}); if(nx==="r1"||nx==="r2") toast("أغلب الشركات لم تصب. اللجنة تفتح مسار الإنقاذ.");
}

/* ---------- السحب والإفلات ---------- */
const needed=n=>n.items.filter(x=>x.k!==-1).length;
function dragDone(n){ return Object.keys(dragState(S.node).placed).length>=needed(n); }
function blocksDone(){ return Object.keys(dragState("blocks").placed).length>=needed(NODES.blocks); }
function renderDrag(n){
 const d=dragState(S.node); const done=dragDone(n);
 const remaining=n.items.map((_,i)=>i).filter(i=>!(i in d.placed)&&!(done&&n.items[i].k===-1)); const team=TEAMS[d.turn%3];
 const placedK=k=>Object.keys(d.placed).filter(i=>n.items[i].k===k);
 let board="";
 if(n.mode==="blocks"){
  const ph=["متى؟","ماذا يفعل؟","ماذا يظهر؟"];
  board=`<div class="blk">${[0,1,2].map(k=>{ const p=placedK(k)[0]; return `<div class="bslot k${k} ${p!==undefined?"ok":""}" data-drop="slot:${k}"><span class="i">${k+1}</span>${p!==undefined?n.items[p].t:ph[k]}</div>`; }).join("")}</div>`;
  const c=placedK(0).length+placedK(1).length+placedK(2).length;
  const CODE=['button_gate.onClick(function() {','  label_gate.setText("البوابة 7"','});'];
  overlay.innerHTML=`<div class="codep"><h6>الشركة المنافسة: كتابة المقطع البرمجي</h6><pre>${CODE.slice(0,c).join("\n")}${done?"":'<span class="cur"></span>'}</pre>${done?'<div class="err">✗ خطأ: ينقص قوس الإغلاق في السطر 2. التطبيق لا يعمل.</div>':""}</div>`;
  if(done) paintScreen("gate");
 }
 if(n.mode==="features"){
  board=`<div class="pipe">${FEATS.map((f,k)=>{ const ps=placedK(k); return `<div class="slot ${ps.length?"ok":""}" data-drop="feat:${k}"><span class="n">${k+1}</span><span class="d">${f.t}${ps.length?`<span class="got">${ps.map(i=>`<span>${n.items[i].t}</span>`).join("")}</span>`:""}</span></div>`; }).join("")}</div>`;
  syncFeats();
 }
 if(n.mode==="tools"){
  const g=placedK("g").map(i=>n.items[i].t), b=placedK("b").map(i=>n.items[i].t);
  overlay.innerHTML=`<div class="zone" data-drop="zone:g" style="--c:#3ccf86;top:60px;right:24px;width:330px"><h5>برامج لإنشاء تطبيقات الهواتف الذكية</h5><div class="got">${g.map(x=>`<span dir="ltr">${x}</span>`).join("")}</div></div>
   <div class="zone" data-drop="zone:b" style="--c:#ef6450;top:60px;left:24px;width:300px"><h5>ليست منها</h5><div class="got">${b.map(x=>`<span>${x}</span>`).join("")}</div></div>`;
  syncTools();
 }
 const hideText=done&&(n.mode==="features"||n.mode==="blocks");
 storyEl.innerHTML=`${kickHTML(n)}<h2>${n.title}</h2><div class="scroll">${hideText?"":`<p class="narr">${n.text}</p>`}${board}</div>${done?whyHTML(n,"اكتملت المهمة:"):""}`;
 bottomEl.innerHTML=`<div class="act"><div class="turn" style="--c:${team.c}">${done?`<b style="color:var(--ok)">✓ اكتملت</b><small>اضغط التالي</small>`:`<small>الدور الآن على</small><b>${team.name}</b><small>اسحب بطاقة واحدة إلى مكانها</small>`}</div>
  <div class="tray ${n.mode==="features"?"small":""}" id="tray">${remaining.map(i=>`<div class="card" data-i="${i}" ${/^[A-Z]/.test(n.items[i].t)?'dir="ltr"':""}>${n.items[i].t}</div>`).join("")||'<span style="color:var(--muted)">لا بطاقات متبقية</span>'}</div></div>`;
 bottomEl.querySelectorAll(".card").forEach(el=>startDraggable(el,n));
}
function startDraggable(el,n){
 el.onpointerdown=e=>{ e.preventDefault(); const i=+el.dataset.i; el.classList.add("dragging");
  const g=document.createElement("div"); g.className="ghost"; g.textContent=n.items[i].t; g.style.fontSize=(22*SCALE)+"px"; g.style.padding=`${10*SCALE}px ${18*SCALE}px`; document.body.appendChild(g);
  let hot=null;
  const move=ev=>{ g.style.left=ev.clientX+"px"; g.style.top=ev.clientY+"px"; const t=dropAt(ev.clientX,ev.clientY); if(hot&&hot!==t) hot.classList.remove("hot"); if(t) t.classList.add("hot"); hot=t; };
  move(e);
  const up=ev=>{ removeEventListener("pointermove",move); removeEventListener("pointerup",up); removeEventListener("pointercancel",up); g.remove(); el.classList.remove("dragging"); if(hot) hot.classList.remove("hot"); const t=dropAt(ev.clientX,ev.clientY); if(t) tryDrop(n,i,t.dataset.drop); };
  addEventListener("pointermove",move); addEventListener("pointerup",up); addEventListener("pointercancel",up); };
}
function dropAt(x,y){ return [...document.querySelectorAll("[data-drop]")].find(el=>{const r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;})||null; }
function tryDrop(n,i,target){
 const d=dragState(S.node); const k=d.turn%3; const it=n.items[i];
 const ok={tools:target==="zone:"+it.k, blocks:target==="slot:"+it.k, features:target==="feat:"+it.k}[n.mode];
 if(ok){ d.placed[i]=k; S.scores[k]+=P_DRAG; S.log.drag[k]++; toast(`✓ ${TEAMS[k].name}: إجابة صحيحة +${P_DRAG}`); renderScores([k]);
  if(n.mode==="features"){ pulse=it.k; pulseT=1.6; } }
 else toast(`✗ ${TEAMS[k].name}: ${({tools:"هل يُستخدم هذا لإنشاء تطبيقات الهواتف الذكية؟",blocks:it.k===-1?"هذه اللبنة لا علاقة لها بزر «بوابتي».":"ليس هذا مكانها. ابدؤوا بالحدث: متى يحدث الأمر؟",features:"اقرؤوا الميزة جيداً: هل تلبي هذه الحاجة؟"})[n.mode]} الدور ينتقل.`);
 d.turn++; save(); renderDrag(n); updateNext();
}

/* ---------- الختام ---------- */
function renderEnd(n){
 const rows=TEAMS.map((t,k)=>`<tr><td style="color:${t.c};font-weight:700;white-space:nowrap">${t.name}</td><td>${S.log.right[k]} / ${S.log.tries[k]}</td><td>${S.log.drag[k]}</td><td style="font-family:var(--display);font-size:30px;color:${t.c}">${S.scores[k]}</td></tr>`).join("");
 const top=Math.max(...S.scores);
 storyEl.innerHTML=`<div class="kick"><span class="tag">نهاية الجولة الثالثة</span></div><h2>${n.title}</h2><div class="scroll"><p class="narr">${n.text}</p>
  <table class="sum"><thead><tr><th>الشركة</th><th>قرارات صحيحة</th><th>بطاقات</th><th>النقاط</th></tr></thead><tbody>${rows}</tbody></table></div>`;
 bottomEl.innerHTML=`<div class="teams">${TEAMS.map((t,k)=>`<div class="team" style="--c:${t.c}"><h4>${t.name}<span class="st ${S.scores[k]===top&&top>0?"ok":""}">${S.scores[k]===top&&top>0?"🏆 متصدر الجولة":""}</span></h4><div class="cons">${S.scores[k]} نقطة · ${S.log.right[k]} قرارات صحيحة · ${S.log.drag[k]} بطاقات صحيحة</div><div class="cons" style="color:var(--gold)">${n.exit}</div></div>`).join("")}</div>`;
}

/* ---------- التنقل ---------- */
function go(id){ S.hist.push(S.node); S.node=id; render(); }
$("nextBtn").onclick=()=>{ const n=NODES[S.node]; if(n.type==="end"){askReset();return;} if($("nextBtn").disabled) return;
 let right=0; if(n.type==="dec") right=decState(S.node).c.filter(c=>c===n.ans).length; go(n.next({right})); };
$("prevBtn").onclick=()=>{ if(!S.hist.length) return; S.node=S.hist.pop(); render(); };
$("revealBtn").onclick=doReveal;
let resetArmed=false;
function askReset(){ const b=$("resetBtn"); if(!resetArmed){ resetArmed=true; b.textContent="اضغط للتأكيد"; b.classList.add("gold"); setTimeout(()=>{resetArmed=false;b.textContent="بداية جديدة";b.classList.remove("gold");},3500); return; }
 resetArmed=false; S=fresh(); b.textContent="بداية جديدة"; b.classList.remove("gold"); render(); }
$("resetBtn").onclick=askReset;
let tId=null,tLeft=0; function stopTimer(){ if(tId){clearInterval(tId);tId=null;} }
$("timerBtn").onclick=()=>{ stopTimer(); tLeft=60; tickT(); tId=setInterval(()=>{tLeft--;tickT();if(tLeft<=0)stopTimer();},1000); };
function tickT(){ const v=$("timerView"); v.textContent=tLeft>0?`0:${String(tLeft).padStart(2,"0")}`:"انتهى"; v.classList.toggle("low",tLeft<=10); }
$("spinBtn").onclick=()=>{ spin=!spin; $("spinBtn").textContent=spin?"إيقاف التدوير":"تدوير الجوال"; };
document.addEventListener("keydown",e=>{ if(e.key==="ArrowLeft") $("nextBtn").click(); else if(e.key==="ArrowRight") $("prevBtn").click(); else if(e.key===" "){ e.preventDefault(); doReveal(); } });

fit(); init3D(); render();
</script>
</body>
</html>
